<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>住院候床問卷</title>

<style>
body {
    margin: 0;
    padding: 15px;
    background: #f3f6f9;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    margin-top: 5px;
    margin-bottom: 25px;
}

.section {
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid #ddd;
}

.question {
    margin-top: 20px;
}

.question-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

input[type="text"],
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: white;
}

.radio-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.radio-item {
    flex: 1;
    min-width: 120px;
}

.radio-item label {
    display: block;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 9px;
    text-align: center;
    cursor: pointer;
    font-size: 18px;
}

.radio-item input {
    margin-right: 6px;
}

.preference-row {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 12px;
    align-items: center;
    margin-bottom: 10px;
}

.room-name {
    font-size: 17px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 8px;
}

.price-table-wrap {
    margin-top: 14px;
    overflow-x: auto;
}

.price-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
    background: #fff;
}

.price-table th,
.price-table td {
    border: 1px solid #d7d7d7;
    padding: 11px 10px;
    text-align: left;
}

.price-table th {
    background: #f3f6f9;
    font-weight: bold;
}

.price-table td:last-child {
    white-space: nowrap;
}

button {
    width: 100%;
    margin-top: 30px;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

button:active {
    background: #125da5;
}

#result {
    display: none;
    margin-top: 30px;
    text-align: center;
}


#resultText {
    text-align: left;
    background: #f3f3f3;
    padding: 16px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 18px;
    line-height: 1.8;
    margin-top: 16px;
}

.notice {
    color: #666;
    font-size: 14px;
    margin-top: 6px;
}

@media(max-width: 480px) {
    .container {
        padding: 16px;
    }

    .preference-row {
        grid-template-columns: 1fr 100px;
    }
}
</style>
</head>

<body>

<div class="container">

<h2 id="title">住院候床問卷</h2>

<div class="question">
    <div class="question-title" id="languageLabel">請選擇語言</div>
    <select id="language">
        <option value="zh">繁體中文</option>
        <option value="en">English</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ไทย</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
    </select>
</div>

<div class="question">
    <div class="question-title" id="nameLabel">病人姓名</div>
    <input type="text" id="patientName" placeholder="請輸入病人姓名">
</div>

<div class="question">
    <div class="question-title" id="identityLabel">病人身分</div>
    <div class="notice" id="identityNotice">請確認病人是否擁有健保卡：如擁有健保卡，請選擇「健保身分」；如無健保卡，請選擇「自費身分」。</div>

    <div class="radio-group">
        <div class="radio-item">
            <label>
                <input type="radio" name="identity" value="健保">
                <span id="insuranceText">健保身分</span>
            </label>
        </div>

        <div class="radio-item">
            <label>
                <input type="radio" name="identity" value="自費">
                <span id="selfPayText">自費身分</span>
            </label>
        </div>
    </div>
</div>

<div class="section">

<div class="question">
    <div class="question-title" id="q1Text">1. 是否同意公布姓名？</div>
    <div class="notice" id="q1Notice">若同意，訪客可向櫃台查詢病人的病房號。</div>

    <div class="radio-group">
        <div class="radio-item">
            <label>
                <input type="radio" name="q1" value="是">
                <span class="yesText">是</span>
            </label>
        </div>

        <div class="radio-item">
            <label>
                <input type="radio" name="q1" value="否">
                <span class="noText">否</span>
            </label>
        </div>
    </div>
</div>


<div class="question" id="healthCardQuestion">
    <div class="question-title" id="q3Text">2. 健保卡是否同意放在醫院？</div>
    <div class="notice" id="q3Notice">※ 如果沒有帶健保卡，請選擇「否」。</div>

    <div class="radio-group">
        <div class="radio-item">
            <label>
                <input type="radio" name="q3" value="是">
                <span class="yesText">是</span>
            </label>
        </div>

        <div class="radio-item">
            <label>
                <input type="radio" name="q3" value="否">
                <span class="noText">否</span>
            </label>
        </div>
    </div>
</div>

</div>

<div class="section" id="selfPayPriceSection" style="display:none;">
    <div class="question">
        <div class="question-title" id="priceTableTitle">自費價格</div>

        <div class="price-table-wrap">
            <table class="price-table" aria-label="加護病房自費價格">
                <tbody>
                    <tr>
                        <td id="icuPriceName">加護病房</td>
                        <td id="icuPriceValue">9712元/天</td>
                    </tr>
                    <tr>
                        <td id="isolationPriceName">隔離病房</td>
                        <td id="isolationPriceValue">6016元/天</td>
                    </tr>
                    <tr>
                        <td id="nurseryPriceName">病嬰室</td>
                        <td id="nurseryPriceValue">5084元/天</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="question">
        <div class="question-title" id="priceConfirmText">價格確認</div>
        <div class="notice" id="priceConfirmNotice">
            我已確認上述自費價格，皆為我可以接受的費用。
        </div>

        <div class="radio-group" style="margin-top:12px;">
            <div class="radio-item">
                <label>
                    <input type="radio" name="priceConfirm" value="是">
                    <span id="priceConfirmYesText">我同意並確認</span>
                </label>
            </div>

            <div class="radio-item">
                <label>
                    <input type="radio" name="priceConfirm" value="否">
                    <span id="priceConfirmNoText">我尚未確認</span>
                </label>
            </div>
        </div>
    </div>
</div>

<button id="generateButton">完成問卷並顯示結果</button>

<div id="result">
    <h2 id="completeTitle">問卷完成</h2>

    <div id="completeNotice">
        請家屬將下方問卷結果拿給櫃檯人員查看。
    </div>

    <div id="resultText"></div>
</div>

</div>

<script>
function getRadio(name) {
    const item = document.querySelector('input[name="' + name + '"]:checked');
    return item ? item.value : "";
}

document.querySelectorAll(".selfpay-pref").forEach(function(select) {
    select.addEventListener("change", function() {
        updatePreferenceChoices(".selfpay-pref");
    });
});

function updateHealthCardQuestion() {
    const identity = getRadio("identity");
    const q3Box = document.getElementById("healthCardQuestion");
    const selfPayPriceSection = document.getElementById("selfPayPriceSection");

    if (identity === "自費") {
        // 自費身分：不顯示問題2（健保卡是否同意放在醫院）。
        q3Box.style.display = "none";
        document.querySelectorAll('input[name="q3"]').forEach(function(r) {
            r.checked = false;
        });
        selfPayPriceSection.style.display = "block";
    } else {
        // 健保身分或尚未選擇身分：顯示問題2。
        q3Box.style.display = "block";
        selfPayPriceSection.style.display = "none";

        document.querySelectorAll('input[name="priceConfirm"]').forEach(function(r) {
            r.checked = false;
        });
    }
}

document.querySelectorAll('input[name="identity"]').forEach(function(radio) {
    radio.addEventListener("change", updateHealthCardQuestion);
});

document.getElementById("generateButton").addEventListener("click", function() {
    const name = document.getElementById("patientName").value.trim();
    const identity = getRadio("identity");
    const q1 = getRadio("q1");
    let q3 = getRadio("q3");

    const currentLanguage = document.getElementById("language").value;
    const currentTranslation = translations[currentLanguage] || translations.zh;
    const priceConfirm = getRadio("priceConfirm");

    if (name === "") {
        alert(currentTranslation.alerts.name);
        return;
    }

    if (identity === "") {
        alert(currentTranslation.alerts.identity);
        return;
    }

    if (q1 === "") {
        alert(currentTranslation.alerts.q1);
        return;
    }

    if (identity !== "自費" && q3 === "") {
        alert(currentTranslation.alerts.q3);
        return;
    }

    // 自費身分仍需選擇價格確認狀態，但「尚未確認」也可以顯示結果。
    if (identity === "自費" && priceConfirm === "") {
        alert(currentTranslation.priceConfirmAlert);
        return;
    }

    const resultData =
        "病人姓名：" + name + "\n" +
        "病人身分：" + identity + "\n" +
        "是否同意公布姓名：" + q1 +
        (identity === "自費"
            ? "\n\n自費價格：\n" +
              "加護病房：9712元/天\n" +
              "隔離病房：6016元/天\n" +
              "病嬰室：5084元/天\n" +
              "價格確認：" + (priceConfirm === "是" ? "已同意並確認" : "尚未確認")
            : "\n健保卡是否同意放在醫院：" + q3);

    document.getElementById("resultText").textContent = resultData;
    document.getElementById("result").style.display = "block";

    document.getElementById("result").scrollIntoView({
        behavior: "smooth"
    });
});

document.getElementById("language").addEventListener("change", function() {
    const t = translations[this.value] || translations.zh;

    document.getElementById("title").textContent = t.title;
    document.getElementById("languageLabel").textContent = t.language;
    document.getElementById("nameLabel").textContent = t.name;
    document.getElementById("patientName").placeholder = t.placeholder;
    document.getElementById("identityLabel").textContent = t.identity;
    document.getElementById("identityNotice").textContent = t.identityNotice;
    document.getElementById("insuranceText").textContent = t.insurance;
    document.getElementById("selfPayText").textContent = t.selfPay;
    document.getElementById("q1Text").textContent = t.q1;
    document.getElementById("q1Notice").textContent = t.q1Notice;
    document.getElementById("q3Text").textContent = t.q3;
    document.getElementById("q3Notice").textContent = t.q3Notice;

    document.querySelectorAll(".yesText").forEach(function(item) {
        item.textContent = t.yes;
    });

    document.querySelectorAll(".noText").forEach(function(item) {
        item.textContent = t.no;
    });

    document.getElementById("priceTableTitle").textContent = t.priceTableTitle;
    document.getElementById("icuPriceName").textContent = t.icuRoom;
    document.getElementById("icuPriceValue").textContent = t.icuPrice;
    document.getElementById("isolationPriceName").textContent = t.isolationRoom;
    document.getElementById("isolationPriceValue").textContent = t.isolationPrice;
    document.getElementById("nurseryPriceName").textContent = t.nurseryRoom;
    document.getElementById("nurseryPriceValue").textContent = t.nurseryPrice;

    document.getElementById("generateButton").textContent = t.button;
    document.getElementById("completeTitle").textContent = t.completeTitle;
    document.getElementById("completeNotice").textContent = t.completeNotice;

    document.getElementById("priceConfirmText").textContent = t.priceConfirmTitle;
    document.getElementById("priceConfirmNotice").textContent = t.priceConfirmNotice;
    document.getElementById("priceConfirmYesText").textContent = t.priceConfirmYes;
    document.getElementById("priceConfirmNoText").textContent = t.priceConfirmNo;
});

// 開啟網頁時，自動依照手機 / 瀏覽器語系選擇語言
(function autoSelectLanguage() {
    const languageSelect = document.getElementById("language");

    // 取得瀏覽器所有語言，依照優先順序排列
    const browserLanguages =
        navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || "en"];

    // 預設英文
    let selectedLanguage = "en";

    // 網頁支援的語言
    const supportedLanguages = [
        "zh",
        "en",
        "id",
        "vi",
        "th",
        "ja",
        "ko"
    ];

    // 依照瀏覽器語言優先順序尋找支援的語言
    for (const lang of browserLanguages) {
        const languageCode = lang.toLowerCase().split("-")[0];

        if (supportedLanguages.includes(languageCode)) {
            selectedLanguage = languageCode;
            break;
        }
    }

    languageSelect.value = selectedLanguage;

    // 觸發既有的語言切換功能
    languageSelect.dispatchEvent(new Event("change"));
})();
